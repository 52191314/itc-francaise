name: french_pro
description: "FrenchPro — A2 French learning app with vocabulary, flashcards, quiz & roleplay trainer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  go_router: ^14.0.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_tts: ^4.0.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
